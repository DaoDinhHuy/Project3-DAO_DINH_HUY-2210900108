<div class="register-container">
  <div class="register-box">
    <h2>Đăng Ký</h2>
    <form>
      <div class="input-group">
        <label for="email">Email/Phone</label>
        <input type="text" id="email" placeholder="Nhập email hoặc số điện thoại" required>
      </div>
      <div class="input-group">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" placeholder="Ít nhất 3 ký tự" required>
      </div>
      <div class="input-group">
        <label for="confirm-password">Gõ lại mật khẩu</label>
        <input type="password" id="confirm-password" placeholder="Ít nhất 3 ký tự" required>
      </div>
      <div class="input-group">
        <label for="full-name">Họ và tên</label>
        <input type="text" id="full-name" placeholder="Nhập họ và tên" required>
      </div>
      <div class="input-group">
        <label for="address">Địa chỉ</label>
        <input type="text" id="address" placeholder="Nhập địa chỉ của bạn" required>
      </div>
      <div class="terms">
        <input type="checkbox" id="terms" required>
        <label for="terms">Tôi đồng ý với các <a href="#">điều khoản và điều kiện</a></label>
      </div>
      <button type="submit" class="btn-register">Đăng Ký</button>
      <p class="login-link">Bạn đã có tài khoản? <a href="/login">Đăng nhập</a></p>
    </form>
  </div>
</div>
